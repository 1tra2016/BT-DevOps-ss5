services:

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: quickbite-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickbite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:latest
    container_name: quickbite-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    networks:
      - quickbite-network

  # =========================
  # USER SERVICE
  # =========================
  user-service:
    build:
      context: ./user-service
    container_name: quickbite-user-service
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    environment:
      USER_SERVER_PORT: ${USER_SERVER_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - quickbite-network


  # =========================
  # RESTAURANT SERVICE
  # =========================
  restaurant-service:
    build:
      context: ./restaurant-service
    container_name: quickbite-restaurant-service
    ports:
      - "${RESTAURANT_SERVER_PORT}:${RESTAURANT_SERVER_PORT}"
    environment:
      RESTAURANT_SERVER_PORT: ${RESTAURANT_SERVER_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      RESTAURANT_DB_NAME: ${RESTAURANT_DB_NAME}
      RESTAURANT_DB_USERNAME: ${RESTAURANT_DB_USERNAME}
      RESTAURANT_DB_PASSWORD: ${RESTAURANT_DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - quickbite-network


  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    build:
      context: ./order-service
    container_name: quickbite-order-service
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    environment:
      ORDER_SERVER_PORT: ${ORDER_SERVER_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - quickbite-network


  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: ./notification-service
    container_name: quickbite-notification-service
    ports:
      - "${NOTIFICATION_SERVER_PORT}:${NOTIFICATION_SERVER_PORT}"
    environment:
      NOTIFICATION_SERVER_PORT: ${NOTIFICATION_SERVER_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - quickbite-network


# =========================
# NETWORK
# =========================
networks:
  quickbite-network:
    driver: bridge


# =========================
# VOLUMES
# =========================
volumes:
  postgres_data: